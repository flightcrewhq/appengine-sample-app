# https://cloud.google.com/appengine/docs/standard/go/config/appref
runtime: go122
service: feed

# The sha1_sum for the favicon for some reason has underscores in it, which
# then fails the CreateVersion request checks "does not match the pattern..."
# handlers:
# - url: /favicon\.ico
#   static_files: static/favicon.ico
#   upload: static/favicon\.ico

instance_class: F1

inbound_services:
- warmup

automatic_scaling:
  max_concurrent_requests: 10
  # max_concurrent_requests: 10

  # min_pending_latency: 0ms
  min_idle_instances: 0

env_variables:
  # Template
  HEADLINE: "Welcome to PlaneChat"
  TEXT_COLOR: "blue"

  # Performance
  CONN_POOL_SIZE: 10
  MAX_THREADS: 10

  # Configs
  SELF_DOCS: 3
  FEED_DOCS: 5

  # Features
  INCLUDE_FOLLOWERS: true 
  TXN_RETRY_STRAT: "none"